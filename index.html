<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>مصاريف</title>
    <meta name="description" content="تطبيق إدارة المصاريف الشخصية — يعمل بالكامل على جهازك" />

    <!-- الثيم: يتغيّر تلقائيًا حسب الوضع الفاتح/الداكن -->
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0D" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS: التطبيق على الشاشة الرئيسية -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مصاريف" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

    <link rel="preload" as="font" type="font/woff2" href="./fonts/plex-ar-arabic-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/plex-ar-arabic-600.woff2" crossorigin />

    <script>
      // منع وميض الثيم الخاطئ قبل تحميل React
      (function () {
        try {
          var t = localStorage.getItem('masareef.theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui; text-align: center">
        هذا التطبيق يحتاج إلى تفعيل JavaScript ليعمل.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
