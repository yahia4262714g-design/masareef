# نشر تلقائي على GitHub Pages عند كل تحديث للفرع الرئيسي
name: نشر التطبيق

on:
  push:
    branches: [main]
  workflow_dispatch: # يسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: read
  pages: write
  id-token: write

# نسمح بنشر واحد في كل مرة، ونلغي القديم إذا وصل تحديث أحدث
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: بناء
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تنصيب الاعتماديات
        run: npm ci

      - name: تشغيل الاختبارات
        run: npm test

      - name: فحص الأنواع
        run: npx tsc -b

      - name: تهيئة Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # يفعّل GitHub Pages تلقائيًا عند أول تشغيل
          enablement: true

      # base_path يساوي "/masareef" لموقع مشروع، أو "" لموقع جذر —
      # وإضافة "/" تعطي المسار الصحيح لـ Vite في الحالتين
      - name: بناء النسخة النهائية
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: رفع المخرجات
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: نشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
